[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "test/tables" },
]

[fuzz]
runs = 1000

[invariant]
runs           = 50
depth          = 300
fail_on_revert = true

[profile.pr-ci.invariant]
runs  = 200
depth = 500

[profile.master-ci.invariant]
runs  = 500
depth = 500

[profile.coverage.invariant]
runs  = 5
depth = 50

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
mainnet = { key = "${MAINNET_API_KEY}" }
